  <style>
    :root {
      --ink: #0f2a2e;
      --ink-soft: #2a4a4f;
      --mist: #eef5f3;
      --paper: #f7fbf9;
      --teal-deep: #0a3d42;
      --teal: #1a6b72;
      --teal-bright: #2ea8a4;
      --foam: #b8e0d8;
      --magma: #e07a3d;
      --gold: #d4a04a;
      --line: rgba(15, 42, 46, 0.12);
      --max: 760px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.7;
    }
    a { color: var(--teal); text-underline-offset: 0.18em; }
    a:hover { color: var(--magma); }

    .wrap {
      width: min(100% - 2.5rem, var(--max));
      margin-inline: auto;
    }

    header {
      background: var(--teal-deep);
      color: var(--mist);
      padding: 2.75rem 0 2.25rem;
    }
    .eyebrow {
      margin: 0 0 0.45rem;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.25;
    }
    .lead {
      margin: 0.7rem 0 0;
      color: rgba(238, 245, 243, 0.88);
    }

    main { padding: 2.25rem 0 3.5rem; }

    .report-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    .report-list li {
      display: grid;
      gap: 0.15rem 1rem;
      align-items: baseline;
      padding: 0.95rem 0;
      border-bottom: 1px solid var(--line);
    }
    .report-list li.has-time {
      grid-template-columns: auto 1fr;
    }
    .slot {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      color: var(--teal-bright);
      white-space: nowrap;
    }
    .names {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.1rem;
      font-size: 1.08rem;
    }
    .names a {
      font-weight: 700;
      text-decoration: none;
    }
    .names a:hover { text-decoration: underline; }
    .pair {
      color: var(--ink-soft);
      font-weight: 500;
    }

    footer {
      padding: 2rem 0 2.5rem;
      background: var(--ink);
      color: rgba(238, 245, 243, 0.7);
      font-size: 0.9rem;
    }
    footer p { margin: 0; }
    footer a { color: var(--foam); }
  </style>
</head>
